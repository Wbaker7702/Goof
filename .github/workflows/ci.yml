name: Node.js Continuous Integration Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  continuous-integration-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Check out Repository Codebase
      uses: actions/checkout@v4

    - name: Initialize Node.js Environment (v${{ matrix.node-version }})
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Architecture Dependencies
      run: npm install

    - name: Execute Full-Stack Validation Tests
      run: npm test --if-present
      env:
        NODE_ENV: test
        NODE_OPTIONS: --openssl-legacy-provider
